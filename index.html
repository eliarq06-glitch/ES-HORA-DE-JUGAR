<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCDF - La Catedral del Fútbol</title>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:999999;font-size:20px;font-weight:bold;font-family:sans-serif;">ERROR FATAL JS: ' + event.message + '<br><small>' + event.filename + ':' + event.lineno + '</small></div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:20px;z-index:999999;font-size:20px;font-weight:bold;font-family:sans-serif;">PROMISE ERROR: ' + (event.reason && event.reason.message ? event.reason.message : event.reason) + '</div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
